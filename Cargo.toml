[workspace]
resolver = "3"
members = ["crates/protocol", "crates/agent"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/ruohki/remote-agent"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
