[package]
name = "protocol"
version = "0.1.0"
edition = "2021"
description = "Wire protocol shared by the remote agent, the management console and the web viewer"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "12.0", features = ["serde-compat"] }
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"

[features]
default = []
