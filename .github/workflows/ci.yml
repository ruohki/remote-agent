name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            features: ""
          - os: windows-latest
            features: "--features winservice"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

      - name: Test
        run: cargo test --workspace ${{ matrix.features }}

      - name: Build release
        run: cargo build --release ${{ matrix.features }}

      - name: Generate protocol bindings
        run: cargo test -p protocol

      # The bindings are committed (the console's web app consumes copies of them), so a
      # protocol change that skipped regeneration must fail here rather than in the console.
      - name: Bindings are up to date
        if: runner.os == 'macOS'
        run: git diff --exit-code -- crates/protocol/bindings
