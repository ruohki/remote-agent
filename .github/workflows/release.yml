name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── gate: never publish a tag that does not pass its own tests ──────────────────────
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # ── macOS universal binary ──────────────────────────────────────────────────────────
  macos:
    needs: test
    runs-on: macos-14
    # Step-level `env` is not in scope for that step's own `if`, so the signing gate has to
    # live at job level.
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERT_BASE64 != '' }}
      HAS_NOTARIZATION: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 != '' }}
      SIGN_IDENTITY: "Developer ID Application: Tillmann Hubner (5A7M476YY2)"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build (arm64 + x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin -p remote-agent
          cargo build --release --target x86_64-apple-darwin -p remote-agent

      - name: Make universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/remote-agent-macos-universal \
            target/aarch64-apple-darwin/release/remote-agent \
            target/x86_64-apple-darwin/release/remote-agent
          chmod +x dist/remote-agent-macos-universal

      # Signing runs only when the certificate secret exists; an unsigned binary is still a
      # usable release asset (the console re-signs the bundle it bakes anyway).
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          CERT_PATH="${RUNNER_TEMP}/certificate.p12"
          echo "${CERT_BASE64}" | base64 --decode > "${CERT_PATH}"

          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

          rm -f "${CERT_PATH}"
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> $GITHUB_ENV

      - name: Codesign
        if: env.HAS_SIGNING == 'true'
        run: |
          codesign --force --options runtime --timestamp \
            --keychain "${KEYCHAIN_PATH}" \
            --sign "${SIGN_IDENTITY}" dist/remote-agent-macos-universal
          codesign --verify --strict --verbose=2 dist/remote-agent-macos-universal

      # A bare Mach-O cannot carry a stapled ticket, so this only records the notarization with
      # Apple; Gatekeeper checks it online. A rejected submission fails the release.
      - name: Notarize
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARIZATION == 'true'
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ASC_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          echo "${ASC_KEY_BASE64}" | base64 --decode > "${ASC_KEY_PATH}"
          ditto -c -k dist/remote-agent-macos-universal "${RUNNER_TEMP}/notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" \
            --key "${ASC_KEY_PATH}" --key-id "${ASC_KEY_ID}" --issuer "${ASC_ISSUER_ID}" --wait
          rm -f "${ASC_KEY_PATH}"

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          if [ -n "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/remote-agent-macos-universal

  # ── Windows binaries ────────────────────────────────────────────────────────────────
  windows:
    needs: test
    runs-on: windows-latest
    env:
      HAS_SIGNING: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: remote-agent-windows-x86_64.exe
          - target: aarch64-pc-windows-msvc
            name: remote-agent-windows-aarch64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features winservice --target ${{ matrix.target }} -p remote-agent

      - name: Sign (optional)
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $bin = "target/${{ matrix.target }}/release/remote-agent.exe"
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" sign `
            /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $bin
          Remove-Item cert.pfx

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/remote-agent.exe" "dist/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.name }}

  # ── Assemble the release ────────────────────────────────────────────────────────────
  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect + checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
